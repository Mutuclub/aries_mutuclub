<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Póliza</title>
<style>
  @page { size: letter; margin: 0; }
  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: Arial, sans-serif;
    font-size: 9pt;
    color: #000;
    background: #fff;
  }

  /* Cada página (frente o reverso) ocupa exactamente una hoja */
  .pagina {
    width: 216mm;
    min-height: 279mm;
    max-height: 279mm;
    overflow: hidden;
    page-break-after: always;
    position: relative;
    padding: 6mm 8mm;
  }
  .pagina:last-child { page-break-after: auto; }

  /* ── FRENTE ─────────────────────────────────────────── */
  .frente { display: flex; flex-direction: column; gap: 3mm; }

  /* Encabezado */
  .header { display: flex; align-items: flex-start; justify-content: space-between; gap: 4mm; }
  .tel-box {
    border: 1.5px solid #1B2A6B;
    padding: 3mm;
    min-width: 38mm;
    font-size: 7.5pt;
    line-height: 1.5;
    color: #1B2A6B;
    font-weight: 700;
  }
  .tel-box .titulo { font-size: 7pt; margin-bottom: 1mm; }
  .logo-box { flex: 1; text-align: center; }
  .logo-box img { max-height: 22mm; max-width: 55mm; }
  .logo-text {
    font-size: 10pt; font-weight: 900; color: #1B2A6B;
    line-height: 1.1; text-align: center;
  }
  .logo-sub { font-size: 7pt; color: #555; }
  .folio-box {
    border: 1.5px solid #1B2A6B;
    padding: 3mm;
    min-width: 45mm;
    font-size: 7.5pt;
    text-align: center;
  }
  .folio-box .folio-titulo {
    background: #1B2A6B; color: #fff;
    font-size: 7pt; font-weight: 700;
    padding: 1mm 2mm; margin: -3mm -3mm 2mm -3mm;
    letter-spacing: 1px;
  }
  .folio-box .folio-num { font-size: 13pt; font-weight: 900; color: #1B2A6B; margin: 1mm 0; }
  .folio-box .rfc { font-size: 6.5pt; color: #333; }

  /* Datos del asociado */
  .seccion-titulo {
    background: #1B2A6B; color: #fff;
    font-size: 7pt; font-weight: 700;
    padding: 1.5mm 3mm;
    letter-spacing: 0.5px;
    text-transform: uppercase;
  }
  .datos-asociado {
    border: 1px solid #1B2A6B;
  }
  .datos-asociado .campo-linea {
    display: flex;
    border-bottom: 1px solid #ccc;
    min-height: 6mm;
    align-items: center;
  }
  .datos-asociado .campo-linea:last-child { border-bottom: none; }
  .datos-asociado .etiq {
    font-size: 6.5pt; font-weight: 700; color: #1B2A6B;
    padding: 1mm 2mm; min-width: 22mm; white-space: nowrap;
  }
  .datos-asociado .val {
    font-size: 8pt; padding: 1mm 2mm; flex: 1;
    border-left: 1px solid #ccc;
  }
  .datos-dos { display: flex; }
  .datos-dos .campo-linea { flex: 1; }
  .vigencia-box {
    border: 1px solid #1B2A6B;
    min-width: 42mm;
    font-size: 7pt;
    text-align: center;
    margin-left: 3mm;
  }
  .vigencia-box .vig-titulo {
    background: #1B2A6B; color: #fff;
    font-size: 6.5pt; font-weight: 700;
    padding: 1mm;
  }
  .vigencia-box .vig-row {
    display: flex; justify-content: space-between;
    padding: 1mm 2mm; border-bottom: 1px solid #ddd;
    font-size: 7pt;
  }
  .vigencia-box .vig-row:last-child { border-bottom: none; }
  .vigencia-box .vig-row .h { font-size: 5.5pt; color: #666; }

  /* Título cobertura */
  .cob-titulo-wrap {
    border: 2px solid #1B2A6B;
    text-align: center;
    padding: 1.5mm;
  }
  .cob-titulo {
    font-size: 11pt; font-weight: 900;
    color: #1B2A6B; letter-spacing: 0.5px;
    text-transform: uppercase;
  }

  /* Datos del vehículo */
  .vehiculo-box {
    border: 1px solid #1B2A6B;
  }
  .vehiculo-box .veh-row {
    display: flex; border-bottom: 1px solid #ccc; min-height: 6mm; align-items: center;
  }
  .vehiculo-box .veh-row:last-child { border-bottom: none; }
  .vehiculo-box .etiq {
    font-size: 6.5pt; font-weight: 700; color: #1B2A6B;
    padding: 1mm 2mm; min-width: 18mm; white-space: nowrap;
  }
  .vehiculo-box .val {
    font-size: 8pt; padding: 1mm 2mm; flex: 1;
    border-left: 1px solid #ccc;
  }
  .veh-triple { display: flex; }
  .veh-triple .campo { flex: 1; display: flex; border-right: 1px solid #ccc; }
  .veh-triple .campo:last-child { border-right: none; }

  /* Tabla de cobertura */
  .cob-table { width: 100%; border-collapse: collapse; }
  .cob-table thead tr {
    background: #1B2A6B; color: #fff;
    font-size: 7.5pt; font-weight: 700;
  }
  .cob-table th { padding: 2mm 3mm; text-align: center; }
  .cob-table td {
    padding: 1.5mm 3mm;
    font-size: 7.5pt;
    text-align: center;
    border: 1px solid #ccc;
    font-weight: 700;
  }
  .cob-table td:first-child { text-align: left; }

  /* Pie frente */
  .pie-frente {
    font-size: 6.5pt; color: #333;
    text-align: center; line-height: 1.5;
    border-top: 1px solid #ccc;
    padding-top: 2mm;
  }
  .firma-row {
    display: flex; align-items: flex-end;
    justify-content: space-between;
    margin-top: 3mm; gap: 4mm;
  }
  .firma-box { text-align: center; font-size: 7pt; }
  .firma-linea { border-top: 1px solid #000; width: 40mm; margin: 1mm auto 0; }
  .agente-box {
    border: 1px solid #999;
    width: 45mm; height: 10mm;
    display: flex; align-items: center;
    padding: 1mm 2mm; font-size: 6.5pt; color: #999;
  }

  /* Sello de la mutualidad */
  .frase-pie {
    font-size: 6pt; color: #333;
    text-align: center; margin-top: 2mm;
    font-style: italic;
  }
  .direccion-pie {
    background: #1B2A6B; color: #fff;
    font-size: 6.5pt; text-align: center;
    padding: 1.5mm; margin-top: 2mm;
  }

  /* ── REVERSO ─────────────────────────────────────────── */
  .reverso {
    display: flex;
    flex-direction: column;
    gap: 2mm;
  }
  .rev-header {
    display: flex; justify-content: space-between;
    align-items: center;
    border-bottom: 2px solid #1B2A6B;
    padding-bottom: 2mm; margin-bottom: 2mm;
  }
  .rev-header .logo-text { font-size: 9pt; }
  .rev-cols {
    display: flex; gap: 4mm; flex: 1;
  }
  .rev-col { flex: 1; }
  .rev-col h3 {
    font-size: 8pt; font-weight: 700;
    color: #1B2A6B;
    border-bottom: 1px solid #1B2A6B;
    padding-bottom: 1mm; margin-bottom: 1.5mm;
    margin-top: 2mm;
    text-transform: uppercase;
  }
  .rev-col p {
    font-size: 7pt; line-height: 1.4;
    margin-bottom: 1mm; color: #222;
  }
  .rev-col p.bullet {
    padding-left: 3mm;
    text-indent: -3mm;
  }

  /* Inbursa / formas de pago */
  .pago-box {
    border: 1px solid #ccc;
    padding: 2mm 3mm;
    font-size: 7pt;
    background: #f9f9f9;
    margin-top: 1mm;
  }
  .pago-box .pago-titulo { font-weight: 700; color: #1B2A6B; margin-bottom: 1mm; }
  .pago-box table { width: 100%; font-size: 6.5pt; }
  .pago-box td { padding: 0.5mm 1mm; }

  .aviso-amarillo {
    background: #FFFF00;
    font-size: 6.5pt; font-weight: 700;
    padding: 1mm 2mm; text-align: center;
    margin-top: 1mm;
  }

  @media print {
    .pagina { page-break-after: always; }
    .pagina:last-child { page-break-after: auto; }
  }
</style>
</head>

const REVERSOS = {"AMPLIA_AUTO_Y_PICK_UP":"<h3>Activación de Póliza.</h3>\n<p>Presentar la siguiente documentación completa:</p>\n<p class=\"bullet\">* Identificación Oficial Vigente del titular de la póliza (Credencial de Elector).</p>\n<p class=\"bullet\">* Tarjeta de Circulación o Pago de Refrendo Legible.</p>\n<p class=\"bullet\">* Comprobante de Domicilio, con una antigüedad no mayor a 90 días.</p>\n<p>Su asesor debe llenar de forma completa su Contrato y usted firmar de aceptación y conformidad</p>\n<h3>GPS.</h3>\n<p class=\"bullet\">* Para activar la cobertura de robo, se debe contar con el equipo GPS y tener activo el servicio con historial visible. El equipo GPS es responsabilidad del afiliado. En caso no contar con el</p>\n<p>equipo GPS la empresa de deslinda de responsabilidad alguna.</p>\n<p class=\"bullet\">* En caso de que el afiliado al momento de un siniestro no se encuentre al corriente de sus pagos, será nula la intervención por parte de la mutualidad.</p>\n<h3>Deducibles.</h3>\n<p class=\"bullet\">* Los deducibles se consideran conforme al valor comercial y se pagará a la compra bajo lo estipulado en el libro azul.</p>\n<h3>Grúas.</h3>\n<p class=\"bullet\">* Se darán dos servicios de grúa de $1,500.00 (Mil Quinientos Pesos 00/100 m.n.) cada uno, no acumulables, ni el mismo día. En caso de que se requiera maniobras, el vehículo se</p>\n<p>encuentre con carga o exceda los $1,500.00 (Mil Quinientos Pesos 00/100 m.n.) se aplicará un cargo el cual será indicado por el operador del servicio de grúas mismo que debe cubrir el</p>\n<p>cliente.</p>\n<p class=\"bullet\">* Las grúas son aplicables únicamente para los vehículos afiliados.</p>\n<h3>En caso de robo.</h3>\n<p class=\"bullet\">* Se debe dar aviso de inmediato a las autoridades correspondientes y a la mutualidad, en caso de que no se de aviso a la mutualidad en tiempo y forma, nos deslinda de toda</p>\n<p>responsabilidad, quedando nulo todo derecho. Será sujeto a investigación por parte de un despacho externo de investigación de fraude.</p>\n<p class=\"bullet\">* Se requiere evidencia del GPS desde 48 horas antes del robo, en caso de no cumplir este requisito nos deslinda de toda responsabilidad, quedando nulo todo derecho de reclamación.</p>\n<h3>En caso de choque.</h3>\n<p>En caso de choque el afiliado deberá llamar de inmediato a la mutualidad y proporcionar la siguiente información:</p>\n<p class=\"bullet\">* Nombre Completo.</p>\n<p class=\"bullet\">* Número de Teléfono (Para que el ajustador se comunique).</p>\n<p class=\"bullet\">* Datos de la Póliza (Número de Folio o Contrato)</p>\n<p class=\"bullet\">* Datos del Vehículo (Marca, Modelo, Placas, Color y Número de Serie)</p>\n<p class=\"bullet\">* Ubicación (Calle y sus entrecalles, Colonia y Municipio)</p>\n<h3>Perdida Total.</h3>\n<p class=\"bullet\">* Se considerará que hubo pérdida total cuando la valuación efectuada por la Compañía, de los daños sufridos por el Vehículo, exceda del 51% de</p>\n<p>la suma asegurada que le corresponda al Vehículo a la fecha del siniestro, conforme al Libro Azul.</p>\n<h3>Cristales.</h3>\n<p class=\"bullet\">* Para hacer valida esta cobertura, la póliza debe estar cubierta al 50% y al corriente de sus pagos.</p>\n<p class=\"bullet\">* O en su defecto, si llegará a requerir el servicio de cambio de cristal, antes de cubrir el 50% de su póliza, tendrá que pagar el monto correspondiente hasta cubrir el porcentaje requerido,</p>\n<p>más su respectivo deducible.</p>\n<p class=\"bullet\">* En caso de requerir el cambio de cristal por rotura se aplicará el deducible del 20%, en caso de que el cristal presentará preexistencias el deducible será del 50%; en ambos casos el</p>\n<p>porcentaje será en base al valor comercial del cristal.</p>\n<h3>Exclusiones.</h3>\n<p class=\"bullet\">* Todo servicio será nulo, si al momento de un siniestro y/o servicio de grúa (Según la cobertura) la póliza presenta atraso en sus pagos mensuales.</p>\n<p class=\"bullet\">* Cuando el conductor se encuentre en estado de ebriedad, presente aliento alcohólico y/o la supuesta ingesta de alguna sustancia psicotrópica o droga.</p>\n<p class=\"bullet\">* El servicio será invalido si el ajustador detecta que se realizó el cambio de conductor en el siniestro.</p>\n<p class=\"bullet\">* Nos reservamos el derecho de asesorarlo, cuando terceros intervengan en las funciones de nuestros abogados.</p>\n<p class=\"bullet\">* Vehículos de servicio público federal.</p>\n<p class=\"bullet\">* El no contar con licencia o permiso para conducir.</p>\n<p class=\"bullet\">* En caso de que el conductor sea Menor de Edad, la póliza queda sin efecto.</p>\n<p class=\"bullet\">* Cuando el siniestro no se reporte de forma inmediata y sea reportado con 24 horas o más de ocurrido.</p>\n<p class=\"bullet\">* Cuando los daños no son ocasionados por choque (Riña, Vandalismo, Sismo, Inundación, Eventos Hidrometeorológicos, etc.)</p>\n<p class=\"bullet\">* Cuando los ocupantes del vehículo asegurado excedan la capacidad de pasajeros permitidos, la póliza queda sin efecto.</p>\n<p class=\"bullet\">* Sentido Contrario</p>\n<p class=\"bullet\">* Vuelta Prohibida</p>\n<p class=\"bullet\">* Exceso de Velocidad</p>\n<p class=\"bullet\">* Cambio de Conductor</p>\n<p class=\"bullet\">* Cambio de Declaración</p>\n<p class=\"bullet\">* No se cubrirá con adaptaciones, modificaciones o accesorios, tales como: Tumbaburros, Arnés, Extensiones, Tubos, Aditamentos, Caja Seca, Camper, etc. O cualquier otra modificación</p>\n<p>que altere el impacto natural.</p>\n<p>Notas. Abreviaturas.</p>\n<p class=\"bullet\">* En este contrato no existe dolo, ni ventaja de ambas partes quedando por enterado al firmar al margen de este. * VLA - Valor Libro Azul</p>\n<p class=\"bullet\">* Valor unitario de $1,000.00 sujeto a venta por paquete. * VC - Valor Comercial</p>\n<p class=\"bullet\">* Los servicios legales los otorga Procar.</p>\n<p class=\"bullet\">* En caso de que el cobrador no acuda a los 2 días siguientes de su function esc(s) {
  if (!s) return '';
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

function fmtFecha(f) {
  if (!f) return '—';
  const [y,m,d] = f.split('-');
  return d && m && y ? `${d}/${m}/${y}` : f;
}

function getReversoHTML(nombreCobertura) {
  const clave = MAPA_REVERSO[nombreCobertura] || MAPA_REVERSO[nombreCobertura?.toUpperCase()];
  if (!clave) return '<p>Sin reverso disponible para esta cobertura.</p>';
  return REVERSOS[clave] || '<p>Sin reverso disponible.</p>';
}

function dividirReverso(html) {
  // Divide el HTML del reverso en dos columnas más o menos equilibradas
  const temp = document.createElement('div');
  temp.innerHTML = html;
  const nodos = [...temp.children];
  const mitad = Math.ceil(nodos.length / 2);
  const col1 = nodos.slice(0, mitad).map(n => n.outerHTML).join('');
  const col2 = nodos.slice(mitad).map(n => n.outerHTML).join('');
  return [col1, col2];
}

  return empresa && empresa.toUpperCase().includes('JUDA');
}
