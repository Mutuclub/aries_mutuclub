<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Póliza</title>
<style>
  @page { size: letter; margin: 0; }
  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: Arial, sans-serif;
    font-size: 9pt;
    color: #000;
    background: #fff;
  }

  /* Cada página (frente o reverso) ocupa exactamente una hoja */
  .pagina {
    width: 216mm;
    min-height: 279mm;
    max-height: 279mm;
    overflow: hidden;
    page-break-after: always;
    position: relative;
    padding: 6mm 8mm;
  }
  .pagina:last-child { page-break-after: auto; }

  /* ── FRENTE ─────────────────────────────────────────── */
  .frente { display: flex; flex-direction: column; gap: 3mm; }

  /* Encabezado */
  .header { display: flex; align-items: flex-start; justify-content: space-between; gap: 4mm; }
  .tel-box {
    border: 1.5px solid #1B2A6B;
    padding: 3mm;
    min-width: 38mm;
    font-size: 7.5pt;
    line-height: 1.5;
    color: #1B2A6B;
    font-weight: 700;
  }
  .tel-box .titulo { font-size: 7pt; margin-bottom: 1mm; }
  .logo-box { flex: 1; text-align: center; }
  .logo-box img { max-height: 22mm; max-width: 55mm; }
  .logo-text {
    font-size: 10pt; font-weight: 900; color: #1B2A6B;
    line-height: 1.1; text-align: center;
  }
  .logo-sub { font-size: 7pt; color: #555; }
  .folio-box {
    border: 1.5px solid #1B2A6B;
    padding: 3mm;
    min-width: 45mm;
    font-size: 7.5pt;
    text-align: center;
  }
  .folio-box .folio-titulo {
    background: #1B2A6B; color: #fff;
    font-size: 7pt; font-weight: 700;
    padding: 1mm 2mm; margin: -3mm -3mm 2mm -3mm;
    letter-spacing: 1px;
  }
  .folio-box .folio-num { font-size: 13pt; font-weight: 900; color: #1B2A6B; margin: 1mm 0; }
  .folio-box .rfc { font-size: 6.5pt; color: #333; }

  /* Datos del asociado */
  .seccion-titulo {
    background: #1B2A6B; color: #fff;
    font-size: 7pt; font-weight: 700;
    padding: 1.5mm 3mm;
    letter-spacing: 0.5px;
    text-transform: uppercase;
  }
  .datos-asociado {
    border: 1px solid #1B2A6B;
  }
  .datos-asociado .campo-linea {
    display: flex;
    border-bottom: 1px solid #ccc;
    min-height: 6mm;
    align-items: center;
  }
  .datos-asociado .campo-linea:last-child { border-bottom: none; }
  .datos-asociado .etiq {
    font-size: 6.5pt; font-weight: 700; color: #1B2A6B;
    padding: 1mm 2mm; min-width: 22mm; white-space: nowrap;
  }
  .datos-asociado .val {
    font-size: 8pt; padding: 1mm 2mm; flex: 1;
    border-left: 1px solid #ccc;
  }
  .datos-dos { display: flex; }
  .datos-dos .campo-linea { flex: 1; }
  .vigencia-box {
    border: 1px solid #1B2A6B;
    min-width: 42mm;
    font-size: 7pt;
    text-align: center;
    margin-left: 3mm;
  }
  .vigencia-box .vig-titulo {
    background: #1B2A6B; color: #fff;
    font-size: 6.5pt; font-weight: 700;
    padding: 1mm;
  }
  .vigencia-box .vig-row {
    display: flex; justify-content: space-between;
    padding: 1mm 2mm; border-bottom: 1px solid #ddd;
    font-size: 7pt;
  }
  .vigencia-box .vig-row:last-child { border-bottom: none; }
  .vigencia-box .vig-row .h { font-size: 5.5pt; color: #666; }

  /* Título cobertura */
  .cob-titulo-wrap {
    border: 2px solid #1B2A6B;
    text-align: center;
    padding: 1.5mm;
  }
  .cob-titulo {
    font-size: 11pt; font-weight: 900;
    color: #1B2A6B; letter-spacing: 0.5px;
    text-transform: uppercase;
  }

  /* Datos del vehículo */
  .vehiculo-box {
    border: 1px solid #1B2A6B;
  }
  .vehiculo-box .veh-row {
    display: flex; border-bottom: 1px solid #ccc; min-height: 6mm; align-items: center;
  }
  .vehiculo-box .veh-row:last-child { border-bottom: none; }
  .vehiculo-box .etiq {
    font-size: 6.5pt; font-weight: 700; color: #1B2A6B;
    padding: 1mm 2mm; min-width: 18mm; white-space: nowrap;
  }
  .vehiculo-box .val {
    font-size: 8pt; padding: 1mm 2mm; flex: 1;
    border-left: 1px solid #ccc;
  }
  .veh-triple { display: flex; }
  .veh-triple .campo { flex: 1; display: flex; border-right: 1px solid #ccc; }
  .veh-triple .campo:last-child { border-right: none; }

  /* Tabla de cobertura */
  .cob-table { width: 100%; border-collapse: collapse; }
  .cob-table thead tr {
    background: #1B2A6B; color: #fff;
    font-size: 7.5pt; font-weight: 700;
  }
  .cob-table th { padding: 2mm 3mm; text-align: center; }
  .cob-table td {
    padding: 1.5mm 3mm;
    font-size: 7.5pt;
    text-align: center;
    border: 1px solid #ccc;
    font-weight: 700;
  }
  .cob-table td:first-child { text-align: left; }

  /* Pie frente */
  .pie-frente {
    font-size: 6.5pt; color: #333;
    text-align: center; line-height: 1.5;
    border-top: 1px solid #ccc;
    padding-top: 2mm;
  }
  .firma-row {
    display: flex; align-items: flex-end;
    justify-content: space-between;
    margin-top: 3mm; gap: 4mm;
  }
  .firma-box { text-align: center; font-size: 7pt; }
  .firma-linea { border-top: 1px solid #000; width: 40mm; margin: 1mm auto 0; }
  .agente-box {
    border: 1px solid #999;
    width: 45mm; height: 10mm;
    display: flex; align-items: center;
    padding: 1mm 2mm; font-size: 6.5pt; color: #999;
  }

  /* Sello de la mutualidad */
  .frase-pie {
    font-size: 6pt; color: #333;
    text-align: center; margin-top: 2mm;
    font-style: italic;
  }
  .direccion-pie {
    background: #1B2A6B; color: #fff;
    font-size: 6.5pt; text-align: center;
    padding: 1.5mm; margin-top: 2mm;
  }

  /* ── REVERSO ─────────────────────────────────────────── */
  .reverso {
    display: flex;
    flex-direction: column;
    gap: 2mm;
  }
  .rev-header {
    display: flex; justify-content: space-between;
    align-items: center;
    border-bottom: 2px solid #1B2A6B;
    padding-bottom: 2mm; margin-bottom: 2mm;
  }
  .rev-header .logo-text { font-size: 9pt; }
  .rev-cols {
    display: flex; gap: 4mm; flex: 1;
  }
  .rev-col { flex: 1; }
  .rev-col h3 {
    font-size: 8pt; font-weight: 700;
    color: #1B2A6B;
    border-bottom: 1px solid #1B2A6B;
    padding-bottom: 1mm; margin-bottom: 1.5mm;
    margin-top: 2mm;
    text-transform: uppercase;
  }
  .rev-col p {
    font-size: 7pt; line-height: 1.4;
    margin-bottom: 1mm; color: #222;
  }
  .rev-col p.bullet {
    padding-left: 3mm;
    text-indent: -3mm;
  }

  /* Inbursa / formas de pago */
  .pago-box {
    border: 1px solid #ccc;
    padding: 2mm 3mm;
    font-size: 7pt;
    background: #f9f9f9;
    margin-top: 1mm;
  }
  .pago-box .pago-titulo { font-weight: 700; color: #1B2A6B; margin-bottom: 1mm; }
  .pago-box table { width: 100%; font-size: 6.5pt; }
  .pago-box td { padding: 0.5mm 1mm; }

  .aviso-amarillo {
    background: #FFFF00;
    font-size: 6.5pt; font-weight: 700;
    padding: 1mm 2mm; text-align: center;
    margin-top: 1mm;
  }

  @media print {
    .pagina { page-break-after: always; }
    .pagina:last-child { page-break-after: auto; }
  }
</style>
</head>
<body>

<script>
// ── DATOS DE LA PÓLIZA (inyectados desde aries.html via window.open + postMessage) ──
// ── CONFIGURACIÓN SUPABASE ──────────────────────────────────────
const SB_URL  = 'https://arkhmgvlmkofghsdffjf.supabase.co';
const SB_ANON = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImFya2htZ3ZsbWtvZmdoc2RmZmpmIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODMwOTUwNjEsImV4cCI6MjA5ODY3MTA2MX0.1nfTTqIXct-LNaaPZhxu5lXrjKil6SIdz8I9OpImY28';

// ── MAPA de nombre de cobertura → clave interna ──────────────────
// Cubre nombres de Aries (Supabase), nombres de Access (histórico) e informe
const MAPA_REVERSO = {"AMPLIA AUTO Y PICK UP": "AMPLIA_AUTO_Y_PICK_UP", "AMPLIA AUTO 100": "AMPLIA_AUTO_Y_PICK_UP", "AMPLIA LOCAL": "AMPLIA_AUTO_Y_PICK_UP", "AMPLIA UNION": "AMPLIA_UNION", "AMPLIA PLATAFORMA": "AMPLIA_PLATAFORMA", "AMPLIA CERO DEDUCIBLE PLATAFORMA": "AMPLIA_CERO_DEDUCIBLE_PLATAFORMA", "AMPLIA MULTIPLATAFORMA": "AMPLIA_MULTIPLATAFORMA", "AMPLIA MOTO TAXI": "AMPLIA_MOTO_TAXI", "LIMITADA AUTO Y PICK UP": "LIMITADA_AUTO_Y_PICK_UP", "LIMITADA LOCAL": "LIMITADA_AUTO_Y_PICK_UP", "LIMITADA VEHICULOS DE CARGA": "LIMITADA_CARGA", "LIMITADA PLATAFORMA": "LIMITADA_PLATAFORMA", "LIMITADA MOTOCICLETA": "LIMITADA_MOTOCICLETA", "LIMITADA MOTO TAXI": "LIMITADA_MOTO_TAXI", "DAÑOS A TERCEROS AUTO Y PICK UP": "TERCEROS_AUTO_Y_PICK_UP", "DAÑOS A TERCEROS LOCAL": "TERCEROS_PLATAFORMA", "DAÑOS A TERCEROS VEHICULO DE CARGA": "TERCEROS_CARGA", "DAÑOS A TERCEROS REMOLQUE": "TERCEROS_REMOLQUE", "DAÑOS A TERCEROS MOTOCICLETA": "TERCEROS_MOTOCICLETA", "DAÑOS A TERCEROS MOTO TAXI": "TERCEROS_MOTO_TAXI", "JUDA AMPLIA": "JUDA_AMPLIA", "JUDA LIMITADA": "JUDA_LIMITADA", "JUDA TERCEROS": "JUDA_TERCEROS", "AMPLIA MOTOCICLETA": "AMPLIA_MOTOCICLETA", "AMPLIA 100": "AMPLIA_AUTO_Y_PICK_UP", "TERCEROS AUTO Y PICK UP": "TERCEROS_AUTO_Y_PICK_UP", "AMPLIA PLATAFORMA PF": "AMPLIA_PLATAFORMA", "AMPLIA PLATAFORMA PF (RESPALDO 21 11 2025)": "AMPLIA_PLATAFORMA", "2026 CERO DEDUCIBLE": "AMPLIA_CERO_DEDUCIBLE_PLATAFORMA", "LIMITADA - MOTO TAXI": "LIMITADA_MOTO_TAXI", "2026 - LIMITADA 2026": "LIMITADA_AUTO_Y_PICK_UP", "PÓLIZA 2021 - LIMITADA CARGA - PROCAR": "LIMITADA_CARGA", "PÓLIZA 2021 - LIMITADA MOTOCICLETA - PROCAR": "LIMITADA_MOTOCICLETA", "PÓLIZA 2021 - LIMITADA PLATAFORMA - PROCAR": "LIMITADA_PLATAFORMA", "PÓLIZA 2021 - TERCEROS AUTO - PROCAR": "TERCEROS_AUTO_Y_PICK_UP", "PÓLIZA 2021 - TERCEROS CARGA - PROCAR": "TERCEROS_CARGA", "PÓLIZA 2021 - TERCEROS REMOLQUE - PROCAR": "TERCEROS_REMOLQUE", "PÓLIZA 2021 - TERCEROS MOTOCICLETA - PROCAR": "TERCEROS_MOTOCICLETA", "PÓLIZA 2021 - TERCEROS TRANSPORTE PÚBLICO - PROCAR": "TERCEROS_PLATAFORMA", "TERCEROS MOTO TAXI - PREVISIÓN FUNERARIA": "TERCEROS_MOTO_TAXI", "TERCEROS REMOLQUE": "TERCEROS_REMOLQUE"};

// ── REVERSOS cargados dinámicamente desde Supabase ───────────────
// Se puebla en cargarReversos() al recibir el mensaje IMPRIMIR_POLIZA
let REVERSOS = {};
let reversosCargados = false;
let datosPendientes  = null;  // guarda datos si llegan antes de que carguen los reversos

async function cargarReversos() {
  try {
    const res = await fetch(
      SB_URL + '/rest/v1/cobertura_reverso?select=id_cobertura,html&order=id_cobertura',
      { headers: { apikey: SB_ANON, Authorization: 'Bearer ' + SB_ANON } }
    );
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const rows = await res.json();

    // Construir lookup id_cobertura → html
    const porId = {};
    rows.forEach(r => { porId[r.id_cobertura] = r.html; });

    // Construir REVERSOS{} indexado por clave interna (igual que antes)
    // usando el mapa inverso: clave → id via MAPA_REVERSO + tabla coberturas
    // Simplificado: también cargamos coberturas para el mapeo nombre→id
    const res2 = await fetch(
      SB_URL + '/rest/v1/coberturas?select=id,nombre&order=id',
      { headers: { apikey: SB_ANON, Authorization: 'Bearer ' + SB_ANON } }
    );
    const cobs = await res2.json();

    // nombre_supabase → id
    const nombreAId = {};
    cobs.forEach(c => { nombreAId[c.nombre.toUpperCase()] = c.id; });

    // clave_interna (ej AMPLIA_AUTO_Y_PICK_UP) → html
    // Recorremos MAPA_REVERSO: valor es la clave interna; buscamos su id via nombre en coberturas
    const claveANombre = {};  // inverso: AMPLIA_AUTO_Y_PICK_UP → "AMPLIA AUTO Y PICK UP" (primer match)
    Object.entries(MAPA_REVERSO).forEach(([nombre, clave]) => {
      if (!claveANombre[clave]) claveANombre[clave] = nombre;
    });

    // Construir REVERSOS por clave interna
    Object.entries(claveANombre).forEach(([clave, nombre]) => {
      // buscar id de cobertura por nombre en Supabase
      // La clave interna tiene _ en lugar de espacio; convertir para buscar
      const nombreNorm = clave.replace(/_/g, ' ');
      const id = nombreAId[nombreNorm] || nombreAId[nombre.toUpperCase()];
      if (id && porId[id]) {
        REVERSOS[clave] = porId[id];
      }
    });

    reversosCargados = true;

    // Si ya había datos esperando, imprimir ahora
    if (datosPendientes) {
      renderPoliza(datosPendientes);
      datosPendientes = null;
    }
  } catch(err) {
    console.error('Error cargando reversos desde Supabase:', err);
    reversosCargados = true; // continuar aunque sea sin reversos
    if (datosPendientes) {
      renderPoliza(datosPendientes);
      datosPendientes = null;
    }
  }
}

// Iniciar carga de reversos inmediatamente al abrir la página
cargarReversos();

function esc(s) {
  if (!s) return '';
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

function fmtFecha(f) {
  if (!f) return '—';
  const [y,m,d] = f.split('-');
  return d && m && y ? `${d}/${m}/${y}` : f;
}

function getReversoHTML(nombreCobertura) {
  const clave = MAPA_REVERSO[nombreCobertura] || MAPA_REVERSO[nombreCobertura?.toUpperCase()];
  if (!clave) return '<p>Sin reverso disponible para esta cobertura.</p>';
  return REVERSOS[clave] || '<p>Sin reverso disponible.</p>';
}

function dividirReverso(html) {
  // Divide el HTML del reverso en dos columnas más o menos equilibradas
  const temp = document.createElement('div');
  temp.innerHTML = html;
  const nodos = [...temp.children];
  const mitad = Math.ceil(nodos.length / 2);
  const col1 = nodos.slice(0, mitad).map(n => n.outerHTML).join('');
  const col2 = nodos.slice(mitad).map(n => n.outerHTML).join('');
  return [col1, col2];
}

function esJuda(empresa) {
  return empresa && empresa.toUpperCase().includes('JUDA');
}

function renderPoliza(datos) {
  const p = datos.poliza  || {};
  const c = datos.cliente || {};
  const e = datos.empresa || {};
  const v = (datos.vehiculos || [])[0] || {};
  const conceptos = datos.conceptos || [];

  const esJ = esJuda(e.nombre || '');
  const nombreCob = p.tipo_cobertura || p.tipo_de_cobertura || '';

  // Frente
  const frente = `
  <div class="pagina">
    <div class="frente">

      <!-- ENCABEZADO -->
      <div class="header">
        <div class="tel-box">
          <div class="titulo">TELEFONOS DE EMERGENCIA<br>LAS 24 HORAS</div>
          33.10.85.46.70<br>
          33.18.23.28.06<br>
          33.18.01.00.75<br>
          33.38.20.21.17
        </div>
        <div class="logo-box">
          ${esJ
            ? `<div class="logo-text" style="font-size:14pt;letter-spacing:2px">MUTUALIDAD JUDA</div>
               <div class="logo-sub">PROTECCION AUTOMOVILISTICA</div>
               <div style="font-size:7.5pt;font-weight:700;color:#1B2A6B;margin-top:2mm">CONTRATO DE RESPONSABILIDAD CIVIL</div>`
            : `<div class="logo-text" style="font-size:16pt">Arts</div>
               <div class="logo-text" style="font-size:18pt;color:#0070C0">Nova</div>
               <div class="logo-text" style="font-size:11pt">MutuClub</div>
               <div class="logo-sub">Mutualidad A.C.</div>`
          }
        </div>
        <div class="folio-box">
          <div class="folio-titulo">FOLIO</div>
          <div class="folio-num">${esc(p.id_poliza)}</div>
          <div class="rfc">${esJ ? 'RFC SARJ770302BC2' : 'R.F.C. MAN160622V9A'}</div>
        </div>
      </div>

      <!-- DATOS DEL ASOCIADO -->
      <div class="seccion-titulo">Datos del Asociado</div>
      <div style="display:flex;gap:3mm">
        <div class="datos-asociado" style="flex:1">
          <div class="campo-linea">
            <span class="etiq">NOMBRE:</span>
            <span class="val">${esc(c.nombre)}</span>
          </div>
          <div class="campo-linea">
            <span class="etiq">DOMICILIO:</span>
            <span class="val">${esc(c.domicilio_particular)}</span>
          </div>
          <div class="datos-dos">
            <div class="campo-linea">
              <span class="etiq">COL.</span>
              <span class="val">${esc(c.colonia)}</span>
            </div>
            <div class="campo-linea">
              <span class="etiq">C.P.</span>
              <span class="val">${esc(c.cp)}</span>
            </div>
          </div>
          <div class="campo-linea">
            <span class="etiq">CIUDAD:</span>
            <span class="val" style="flex:1">${esc(c.municipio)}</span>
            <span class="etiq" style="border-left:1px solid #ccc">TEL.</span>
            <span class="val">${esc(c.telefono_01)}</span>
          </div>
        </div>
        <div class="vigencia-box">
          <div class="vig-titulo">VIGENCIA</div>
          <div class="vig-row">
            <span>DEL</span>
            <span class="h">DESDE LAS<br>12:00 HORAS</span>
          </div>
          <div class="vig-row" style="font-weight:700;font-size:8pt">${fmtFecha(p.fecha_inicio_vigencia)}</div>
          <div class="vig-row">
            <span>AL</span>
            <span class="h">HASTA LAS<br>12:00 HORAS</span>
          </div>
          <div class="vig-row" style="font-weight:700;font-size:8pt">${fmtFecha(p.fecha_termino_vigencia)}</div>
        </div>
      </div>

      <!-- TÍTULO COBERTURA -->
      <div class="cob-titulo-wrap">
        <div class="cob-titulo">${esc(nombreCob)}</div>
      </div>

      <!-- DATOS DEL VEHÍCULO -->
      <div class="seccion-titulo">Datos del Vehículo</div>
      <div class="vehiculo-box">
        <div class="veh-row">
          <span class="etiq">MARCA:</span>
          <span class="val" style="font-weight:700;font-size:9pt">${esc(v.vehiculo?.split(' ')[0])}</span>
          <span class="etiq" style="border-left:1px solid #ccc">No. DE SERIE:</span>
          <span class="val">${esc(v.numero_serie)}</span>
        </div>
        <div class="veh-row">
          <span class="etiq">PLACAS:</span>
          <span class="val">${esc(v.placas)}</span>
          <span class="etiq" style="border-left:1px solid #ccc">No. DE MOTOR:</span>
          <span class="val">${esc(v.motor)}</span>
        </div>
        <div class="veh-triple">
          <div class="campo">
            <span class="etiq">MODELO:</span>
            <span class="val">${esc(v.modelo)}</span>
          </div>
          <div class="campo">
            <span class="etiq">SUBMARCA:</span>
            <span class="val">${esc(v.vehiculo?.split(' ').slice(1,-1).join(' '))}</span>
          </div>
          <div class="campo">
            <span class="etiq">COLOR:</span>
            <span class="val">${esc(v.color)}</span>
          </div>
        </div>
      </div>

      <!-- TABLA COBERTURA -->
      <div class="seccion-titulo" style="text-align:center">Cobertura</div>
      <table class="cob-table">
        <thead>
          <tr>
            <th style="width:45%;text-align:left">COBERTURA</th>
            <th style="width:35%">SUMA ASEGURADA</th>
            <th style="width:20%">DEDUCIBLE</th>
          </tr>
        </thead>
        <tbody>
          ${conceptos.map(con => `
            <tr>
              <td>${esc(con.concepto)}</td>
              <td>${esc(con.suma_asegurada || '')}</td>
              <td>${esc(con.deducible || '')}</td>
            </tr>
          `).join('')}
        </tbody>
      </table>

      <!-- PIE -->
      <div class="pie-frente">
        PARA RECIBIR LOS BENEFICIOS EL ASOCIADO DEBERÁ DE ESTAR AL CORRIENTE DE LAS APORTACIONES<br>
        NO CONDUCIR EN ESTADO DE EBRIEDAD O BAJO EL EFECTO DE SUSTANCIAS PSICOTROPICAS (DROGAS)<br>
        CONDUCIRSE CON TODA LA VERDAD CON EL AJUSTADOR DE LA MUTUALIDAD
      </div>

  if (e.data && e.data.tipo === 'IMPRIMIR_POLIZA') {
    if (reversosCargados) {
      renderPoliza(e.data.datos);
    } else {
      datosPendientes = e.data.datos; // esperar a que carguen los reversos
    }
  }
});
