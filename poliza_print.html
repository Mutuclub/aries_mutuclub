function esc(s){if(!s)return'';return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function fmtFecha(f){if(!f)return'—';const[y,m,d]=f.split('-');return d&&m&&y?`${d}/${m}/${y}`:f;}

function getFormato(nombre){
  if(!nombre)return null;
  const u=nombre.trim().toUpperCase();
  for(const[k,v]of Object.entries(MAPA_FORMATO)){if(u===k.toUpperCase())return v;}
  for(const[k,v]of Object.entries(MAPA_FORMATO)){if(u.includes(k.toUpperCase())||k.toUpperCase().includes(u))return v;}
  return null;
}

function dividirReverso(html){
  const t=document.createElement('div');t.innerHTML=html;
  const n=[...t.children];const m=Math.ceil(n.length/2);
  return[n.slice(0,m).map(x=>x.outerHTML).join(''),n.slice(m).map(x=>x.outerHTML).join('')];
}

function esJuda(empresa){return empresa&&empresa.toUpperCase().includes('JUDA');}

// ════════════════════════════════════════════════════
// RENDER PRINCIPAL
// ════════════════════════════════════════════════════
function renderPoliza(datos){
  const p=datos.poliza||{};
  const c=datos.cliente||{};
  const e=datos.empresa||{};
  const v=(datos.vehiculos||[])[0]||{};
  const conceptos=datos.conceptos||[];
  const esJ=esJuda(e.nombre||p.empresa||'');
  const nombreCob=(p.tipo_cobertura||p.tipo_de_cobertura||'').trim();
  const clave=getFormato(nombreCob);

  let paginas='';

  if(esJ){
    // Juda: solo frente, sin reverso
    paginas=frenteJuda(p,c,v,conceptos,nombreCob);
  } else {
    // Arts Nova: frente + reverso hoja 1 + hoja 2 (frente+reverso)
    paginas=frenteArtsNova(p,c,v,conceptos,nombreCob,clave);

    // Reverso hoja 1
    const revHTML=clave&&REVERSOS[clave]?REVERSOS[clave]:'<p>Sin reverso disponible para esta cobertura.</p>';
    const[col1,col2]=dividirReverso(revHTML);
    paginas+=`<div class="pagina"><div class="reverso">
      <div class="rev-header">
        <div><div class="logo-text" style="font-size:9pt">Arts Nova MutuClub</div><div class="logo-sub">R.F.C. MAN160622V9A</div></div>
        <div style="text-align:right;font-size:7pt"><strong>No. Póliza:</strong> ${esc(p.id_poliza)}&nbsp;&nbsp;<strong>Asociado:</strong> ${esc(c.nombre)}</div>
      </div>
      <div class="rev-cols"><div class="rev-col">${col1}</div><div class="rev-col">${col2}</div></div>
    </div></div>`;

    // Hoja 2
    paginas+=hoja2F(p,c,v)+hoja2R();
  }

  document.body.innerHTML=paginas;
  setTimeout(()=>window.print(),500);
}
